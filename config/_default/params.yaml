# SITE SETUP
# Hugo Blox Builder
# https://docs.hugoblox.com/

# -------------------------
# FORCE BLOCK-BASED HOMEPAGE (CRITICAL)
# -------------------------
home:
  sections:
    enabled: true

cv:
  enable: false

# -------------------------
# Appearance
# -------------------------
appearance:
  mode: system
  color: indigo

# -------------------------
# Marketing & SEO
# -------------------------
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Emil Mathew Binny'
    description: >
      Emil Mathew Binny is a business and economics professional offering
      consulting, tutoring, UPSC economics coaching, and interview preparation.
      Experience across strategy consulting, finance, and higher education.
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# -------------------------
# Site Header / Navbar
# -------------------------
header:
  navbar:
    enable: true
    block: navbar
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Emil Mathew Binny'

# -------------------------
# Site Footer
# -------------------------
footer:
  copyright:
    notice: '© {year} Emil Mathew Binny. All rights reserved.'
    license:
      enable: false

# -------------------------
# Localization
# -------------------------
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# -------------------------
# Site Features
# -------------------------
features:
  math:
    enable: false
  privacy_pack:
    enable: false


