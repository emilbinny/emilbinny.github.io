# SITE SETUP
# Hugo Blox Builder
# https://docs.hugoblox.com/

# -------------------------
# Appearance
# -------------------------
appearance:
  mode: system
  color: indigo

# -------------------------
# Marketing & SEO
# -------------------------
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Emil Mathew Binny'
    description: >
      Emil Mathew Binny is a business and economics professional offering
      consulting, economic research, tutoring, and interview preparation.
      Experience across strategy, finance, corporate consulting, and higher education.
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# -------------------------
# Academic CV Homepage (ENABLE THIS)
# -------------------------
cv:
  enable: true

hero:
  enable: true

# -------------------------
# Site Header / Navbar
# -------------------------
header:
  navbar:
    enable: true
    block: navbar
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      icon: '/uploads/logo_extracted.png'
      text: ''

# -------------------------
# Site Footer
# -------------------------
footer:
  copyright:
    notice: '© {year} Emil Mathew Binny. All rights reserved.'
    license:
      enable: false

# -------------------------
# Localization
# -------------------------
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# -------------------------
# Site Features
# -------------------------
features:
  math:
    enable: false
  privacy_pack:
    enable: false
# -------------------------
# Social Media
# -------------------------
social:
  - icon: linkedin
    url: 'https://www.linkedin.com/in/emilbinny/'
  - icon: instagram
    url: 'https://www.instagram.com/_dil_e_mil_/'
  - icon: facebook
    url: 'https://www.facebook.com/emil.binny'
  - icon: youtube
    url: 'https://www.youtube.com/@emilbinny'
  - icon: researchgate
    url: 'https://www.researchgate.net/profile/Emil-Binny'

