<!-- EB Logo + Social Icons Injection -->
<style>
  /* Hide the default empty navbar logo text */
  .navbar-logo .logo-text, .navbar-brand .logo-text {
    display: none !important;
  }

  /* Inject logo image via CSS into navbar brand area */
  .navbar-logo::before, .navbar-brand::before {
    content: '';
    display: inline-block;
    width: 42px;
    height: 42px;
    background-image: url('/media/logo_extracted.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    vertical-align: middle;
    margin-right: 8px;
  }

  /* Social Icons Container — fixed bottom left */
  .social-icons-fixed {
    position: fixed;
    bottom: 28px;
    left: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 9998;
  }

  .social-icons-fixed a {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(30, 30, 40, 0.85);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .social-icons-fixed a:hover {
    transform: scale(1.12);
    background: rgba(50, 50, 70, 0.95);
    border-color: rgba(201, 168, 76, 0.5);
  }

  .social-icons-fixed a svg {
    width: 18px;
    height: 18px;
    fill: #ffffff;
  }

  /* On mobile — move social icons to horizontal row above WhatsApp */
  @media (max-width: 600px) {
    .social-icons-fixed {
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: row;
      gap: 10px;
    }
  }
</style>
